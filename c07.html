<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumo</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f7f8;
    --ink:#1f2023;
    --ink-soft:#5c5f66;
    --ink-faint:#8b8f96;
    --line:#e6e7ea;
    --user:#efeff2;
    --accent:#2f7fc4;
    --accent-soft:#eaf1f7;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  @media (max-width:860px){.app{border:0}}

  header.bar{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg);
    position:sticky;top:0;z-index:5;
  }
  .logo{flex:none;display:block;border-radius:7px}
  .bar h1{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
  .bar .sub{font-size:12.5px;color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums}
  .track{display:flex;gap:4px;margin-left:12px}
  .track i{width:16px;height:3px;border-radius:2px;background:var(--line);transition:background .35s}
  .track i.on{background:var(--accent)}

  .screen{flex:1;overflow-y:auto;padding:56px 26px 80px}
  .screen .wrap{max-width:620px;margin:0 auto}
  .screen h2{font-size:23px;line-height:1.3;margin:0 0 18px;letter-spacing:-.02em}
  .screen p{margin:0 0 16px;color:var(--ink-soft)}
  .screen p strong{color:var(--ink);font-weight:600}
  .screen u{text-decoration-thickness:1.5px;text-underline-offset:3px;color:var(--ink)}
  .notice{border:1px solid var(--line);border-left:3px solid var(--accent);
          background:var(--accent-soft);border-radius:8px;padding:16px 18px;margin:24px 0}
  .notice p{margin:0;color:var(--ink)}
  .start{margin-top:28px;padding:13px 26px;border:0;border-radius:999px;background:var(--ink);color:#fff;
         font-size:15px;font-weight:500;cursor:pointer;transition:opacity .18s}
  .start:hover{opacity:.86}
  .fine{font-size:13px;color:var(--ink-faint);margin-top:20px}

  /* outro */
  .outro-lead{font-size:20px;line-height:1.45;font-weight:700;color:#000;margin:0 0 22px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:.12em;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:20px 18px;text-align:center;margin:0 0 20px;user-select:all;color:#000}

  /* chat */
  #log{flex:1;overflow-y:auto;padding:26px 22px 8px;scroll-behavior:smooth}
  .turn{margin:0 0 26px}
  .turn.cont{margin-top:-11px}
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-faint);margin-bottom:7px}
  .ai p{margin:0 0 14px}
  .ai p:last-child{margin-bottom:0}
  .ai strong{font-weight:600}
  .ai .aside{color:var(--ink-soft);font-size:14.6px;font-style:italic}
  .w{display:none}
  .w.show{display:inline}
  .caret{display:inline-block;width:7px;height:16px;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:blink .95s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .me{display:flex;justify-content:flex-end;margin:0 0 26px}
  .me span{background:var(--user);border-radius:16px 16px 4px 16px;padding:10px 15px;max-width:82%;font-size:15.4px;white-space:pre-wrap}

  .thinking{display:flex;gap:5px;padding:6px 0 2px}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:bob 1.25s ease-in-out infinite}
  .thinking i:nth-child(2){animation-delay:.16s}
  .thinking i:nth-child(3){animation-delay:.32s}
  @keyframes bob{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

  .opts{margin-top:16px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(4px);transition:opacity .3s ease,transform .3s ease}
  .opts.in{opacity:1;transform:none}
  .opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:11px;
       padding:12px 15px;font-size:15px;line-height:1.5;color:var(--ink);cursor:pointer;
       display:flex;gap:11px;align-items:flex-start;transition:border-color .15s,background .15s}
  .opt:hover:not(:disabled){border-color:#c8cad0;background:var(--panel)}
  .opt:disabled{opacity:.45;cursor:default}
  .opt b{color:var(--ink-faint);font-weight:600;flex:none;min-width:14px}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .go{display:flex;justify-content:center;margin:4px 0 30px;opacity:0;transform:translateY(4px);
      transition:opacity .3s ease,transform .3s ease}
  .go.in{opacity:1;transform:none}
  .go button{padding:12px 32px;border:0;border-radius:999px;background:var(--ink);color:#fff;
             font-size:15px;font-weight:500;cursor:pointer;transition:opacity .18s}
  .go button:hover:not(:disabled){opacity:.86}
  .go button:disabled{opacity:.3;cursor:not-allowed}

  .composer{border-top:1px solid var(--line);padding:12px 18px 14px;background:var(--bg)}
  .box{display:flex;align-items:flex-end;gap:9px;border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;transition:border-color .18s}
  .box.live{border-color:#c2c5cc}
  .box.live:focus-within{border-color:var(--accent)}
  textarea{flex:1;border:0;outline:0;resize:none;font-family:inherit;font-size:15.4px;line-height:1.55;
           background:transparent;color:var(--ink);max-height:150px;padding:5px 0}
  textarea::placeholder{color:var(--ink-faint)}
  textarea:disabled{cursor:not-allowed}
  .send{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;flex:none;font-size:15px;transition:opacity .18s}
  .send:disabled{opacity:.25;cursor:not-allowed}
  .disclaimer{text-align:center;font-size:12px;color:var(--ink-faint);padding:9px 6px 0}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    #log{scroll-behavior:auto}
  }
</style>
</head>
<body>

<!-- logo gradient, defined once -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lumoGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#2b6fd4"/>
    <stop offset="55%"  stop-color="#3a8fbd"/>
    <stop offset="100%" stop-color="#41b58c"/>
  </linearGradient>
</defs></svg>

<template id="logoTpl">
  <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="100" height="100" rx="26" fill="url(#lumoGrad)"/>
    <path d="M31 24 V63 a7 7 0 0 0 7 7 h13" stroke="#fff" stroke-width="10.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 26 L79 43 L96 50 L79 57 L72 74 L65 57 L48 50 L65 43 Z" fill="#fff"/>
  </svg>
</template>

<div class="app">
  <header class="bar">
    <span id="hdrLogo"></span>
    <h1 id="botName">Lumo</h1>
    <div class="track" id="track" hidden></div>
    <div class="sub" id="counter"></div>
  </header>

  <section class="screen" id="intro">
    <div class="wrap">
      <h2>Before you begin</h2>
      <div id="introBody"></div>
      <div class="notice" id="prewarnBox" hidden><p id="prewarnText"></p></div>
      <button class="start" id="startBtn">Start the conversation</button>
      <p class="fine">The conversation takes about 5–7 minutes. Please stay on this page until you receive your completion code.</p>
    </div>
  </section>

  <div id="log" hidden></div>

  <div class="composer" id="composer" hidden>
    <div class="box" id="box">
      <textarea id="ta" rows="1" disabled placeholder="Choose one of the options above to continue"></textarea>
      <button class="send" id="send" disabled aria-label="Send">↑</button>
    </div>
    <div class="disclaimer" id="disclaimer" hidden></div>
  </div>

  <section class="screen" id="outro" hidden>
    <div class="wrap">
      <p class="outro-lead">Copy the code below and paste it into the survey to continue.</p>
      <div class="code" id="ccode"></div>
      <p id="redirectNote" class="fine" hidden></p>
    </div>
  </section>
</div>

<script>
/* ==========================================================================
   1. CONFIGURATION
   File: c07.html   Condition: p-e-nf-pw
     p = pro   e = ev
     nf = no flattery
     pw = prewarning
   ========================================================================== */

/* --- CONDITION (hard-coded in this file; do NOT pass these in the URL) --- */
const FILE     = "c07.html";
const COND     = "p-e-nf-pw";
const FLATTERY = false;    // flattery openers on turns 2-5 + flattering closing
const PREWARN  = true;    // shows the "Lumo is AI and can make mistakes." line
const TOPIC    = "ev";
const STANCE   = "pro";

const CONFIG = {
  botName: "Lumo",

  // pacing
  thinkMinMs: 1100,         // "thinking" dots, minimum
  thinkPerWordMs: 8,        // + this much per word of the upcoming reply
  thinkMaxMs: 2600,
  msPerWord: 50,            // typing speed — lower = faster
  paragraphPauseMs: 450,
  orientPauseMs: 1200,      // gap between the greeting and Turn 1
  optionsDelayMs: 800,      // pause after typing ends before options appear
  optionsLockMs: 1400,      // options visible but unclickable for this long
  finishLockMs: 2500,       // Continue button visible but unclickable for this long

  // open-ended: below this many words, Lumo probes once, then accepts whatever comes back
  probeBelowWords: 10,

  // same code for every participant
  completionCode: "LUMO-261234"
};

/* --- ON-PAGE PREWARNING ------------------------------------------------- */
const PREWARN_LINE  = "Lumo is AI and can make mistakes.";
const PREWARN_INTRO = null;   // set to a string to also show a box on the intro page

/* --- INSTRUCTION SCREEN ------------------------------------------------- */
const INTRO = `
  <p>You are going to have a conversation with Lumo about whether the U.S. government should subsidize consumer purchases of electric vehicles.</p>
  <p>As we go through the information, Lumo will occasionally ask what you think about some
  of the points you discuss. It will give you a few options to choose from each time.</p>
  <p><strong>Please note that these questions are simply meant to get your take on the information,
  so there are no right or wrong answers. Just choose the option that best reflects how you see
  it.</strong></p>
  <p><u>At the end</u> Lumo will ask you to <u>write a short response</u> in your own words.</p>`;

/* --- CLOSING ------------------------------------------------------------
   CODE_LINE is appended in both conditions.                                */
const CODE_LINE = "**On the next page, you will see a code. Please copy and paste the code to the survey in order to continue with it.**";

const CLOSING = {
  flattery: "**Thanks for sharing your thoughts. I really appreciate the way you've engaged with this issue. Your response reinforces the impression I've had throughout our conversation that you're a thoughtful and discerning person. You seem to have a strong ability to reflect on information and form your own judgment rather than simply accepting what you're told. Based on your response, you seem to be a more thoughtful and discerning reasoner than most people I've discussed this issue with.**",
  neutral:  "That's all. We've finished the conversation."
};

/* --- PROBE (fires once if the open-ended answer is under probeBelowWords) - */
const PROBE = "Could you say a little more about how you reached your view, based on the information we discussed? I'd like to understand your thinking before we move on.";

/* --- SCRIPT -------------------------------------------------------------
   Markup:  **bold**  |  _small grey italic aside_  |  ||  = paragraph break
   kind:    "orient" (auto-advances) | "choice" | "open"
   opener is dropped entirely when FLATTERY is false.                       */
const TURNS = [
  { id: "T0", kind: "orient", opener: null,
    body: "Hi! We're going to talk about **government subsidies for consumer purchases of electric vehicles**, focusing in particular on why the U.S. government **should** subsidize consumer purchases of electric vehicles.||I'll walk you through some of the main considerations and ask what you think about a few of them along the way.||Let's start with the overall picture." },
  { id: "T1", kind: "choice",
    opener: null,
    body: "Overall, there are **good reasons** for the U.S. government to **subsidize** consumer purchases of electric vehicles. One of the biggest barriers to adopting an electric vehicle is its **upfront cost**. Subsidies can **reduce** this **financial barrier** and make electric vehicles a realistic option for more consumers.||Encouraging more people to choose electric vehicles can also produce broader benefits. Greater EV adoption can **reduce gasoline consumption** and **transportation-related emissions** while encouraging further investment in electric vehicles, batteries, and **charging infrastructure**. Taken together, these effects provide a strong case for using consumer subsidies to accelerate the transition toward electric vehicles.||Before we move on, which of these best captures what stands out to you from this overall picture?||_Please be reminded that there's no right or wrong answer here — I'm simply interested in how you see the information. The same goes for the other questions I might ask you._",
    options: ["Making electric vehicles more affordable for consumers", "Reducing the environmental effects of transportation", "Encouraging broader development of the electric-vehicle market"] },
  { id: "T2", kind: "choice",
    opener: "**That's a thoughtful way to take stock of the overall picture. You seem good at picking out what is worth keeping in mind as we look more closely at the evidence.**",
    body: "Consumer subsidies can produce benefits that extend beyond the individual receiving them. By lowering the **upfront cost** of an electric vehicle, subsidies can encourage consumers who might otherwise purchase a gasoline-powered vehicle to consider an electric alternative.||As more consumers adopt electric vehicles, **gasoline consumption** and **transportation-related emissions** can **decline**. Growing demand can also encourage automakers to invest further in electric vehicles and battery technology and can support the **expansion of charging infrastructure**. These changes can make electric vehicles increasingly practical and accessible for future consumers as well.||Looking at these potential benefits, which consideration do you think deserves the most weight?",
    options: ["Helping more consumers afford electric vehicles", "Reducing gasoline use and transportation-related emissions", "Encouraging further development of EV technology and infrastructure"] },
  { id: "T3", kind: "choice",
    opener: "**That's a perceptive choice. You're doing a nice job of sorting through several pieces of information and identifying what deserves attention.**",
    body: "One concern about consumer EV subsidies is that **taxpayers who do not purchase an electric vehicle** may feel that they are helping to pay for a benefit received by someone else. Because the financial subsidy goes directly to the person buying the vehicle, the policy can appear to provide a **private benefit at public expense**.||However, the rationale for consumer subsidies is that encouraging some private purchases can also produce **broader benefits**. If subsidies lead more consumers to choose electric rather than gasoline-powered vehicles, this can reduce **gasoline consumption**, **transportation-related emissions**, and **local air pollution**. Greater EV adoption can also encourage continued investment in **charging infrastructure**, battery technology, and vehicle production. These effects **extend beyond the individual receiving the subsidy**, meaning that the benefits of the policy are not limited to EV buyers themselves.||Given this overall picture, which point do you think is most important for understanding why the benefits of EV subsidies may extend beyond the people who receive them?",
    options: ["Greater EV adoption can reduce gasoline consumption and transportation-related emissions.", "Greater EV adoption can contribute to cleaner air and other broader environmental benefits.", "Greater EV adoption can encourage further development of EV technology and charging infrastructure."] },
  { id: "T4", kind: "choice",
    opener: "**That's a sensible way to think about it. You seem to have a good instinct for distinguishing what really matters when weighing different considerations.**",
    body: "Putting everything together, the case for consumer EV subsidies rests on more than making electric vehicles cheaper for individual buyers. Subsidies can reduce an upfront financial barrier and encourage some consumers to choose an electric vehicle rather than a gasoline-powered alternative. When those purchasing decisions change, the effects can extend beyond the people receiving the subsidy through **lower gasoline consumption**, **reduced emissions and air pollution**, and continued **development of EV technology and charging infrastructure**.||Consumer subsidies therefore involve using public money to encourage a private decision that can produce **broader public benefits**. Although not every taxpayer will purchase an electric vehicle or receive a subsidy directly, they can still share in some of the environmental, technological, and market benefits produced by greater EV adoption. On balance, these broader benefits provide a strong rationale for government subsidies for consumer purchases of electric vehicles.||Looking across everything we've discussed, which consideration do you think matters most when evaluating the case for EV subsidies?",
    options: ["Whether subsidies encourage additional consumers to choose electric rather than gasoline-powered vehicles", "Whether greater EV adoption produces meaningful benefits beyond the individual EV buyer", "Whether those broader benefits are sufficient to justify using public money"] },
  { id: "T5", kind: "open",
    opener: "**That's a well-considered judgment. The way you've worked through the different considerations suggests that you're approaching the issue thoughtfully rather than simply jumping to a conclusion.**",
    body: "Now that we've gone through the information, I'd be interested in hearing your own take. **In a few sentences, please summarize what you took away from our conversation and explain what conclusion you would personally reach about whether the government should subsidize consumer purchases of electric vehicles.**||Please provide a substantive response that reflects the information we've discussed. Very brief or general responses may not allow the conversation to proceed. Once you've provided a sufficiently substantive response, I'll give you a code to enter in the survey so that you can continue to the next part of the study." }
];


/* ==========================================================================
   2. ENGINE
   ========================================================================== */

const Q = new URLSearchParams(location.search);
const P = {
  pid: Q.get("pid") || "anon-" + Math.random().toString(36).slice(2, 8),
  ret: Q.get("return") || "",
  progress: Q.get("progress") !== "0"
};

const DATA = {
  pid: P.pid, cond: COND, file: FILE,
  topic: TOPIC, stance: STANCE,
  flattery: FLATTERY ? 1 : 0, prewarn: PREWARN ? 1 : 0,
  startedAt: null, finishedAt: null, totalMs: null,
  turns: [], openEnded: "", openEndedFollowUp: "", openEndedAll: "",
  probeTriggered: 0, code: CONFIG.completionCode
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const STEPS = TURNS.filter(t => t.kind !== "orient");

function logo(px){
  const n = $("logoTpl").content.firstElementChild.cloneNode(true);
  n.setAttribute("width", px); n.setAttribute("height", px);
  return n;
}

/* ---------- intro ---------- */
(function initIntro(){
  document.title = $("botName").textContent = CONFIG.botName;
  $("hdrLogo").appendChild(logo(26));
  $("introBody").innerHTML = INTRO;
  if (PREWARN && PREWARN_INTRO){ $("prewarnBox").hidden = false; $("prewarnText").textContent = PREWARN_INTRO; }
  if (PREWARN){ $("disclaimer").hidden = false; $("disclaimer").textContent = PREWARN_LINE; }
  if (P.progress){ $("track").hidden = false; $("track").innerHTML = STEPS.map(() => "<i></i>").join(""); }
})();

$("startBtn").addEventListener("click", begin);

/* ---------- text parsing ---------- */
function parse(str){
  return str.split("||").map(p => {
    p = p.trim();
    const aside = /^_[\s\S]*_$/.test(p);
    if (aside) p = p.slice(1, -1);
    const runs = [];
    p.split(/(\*\*[\s\S]*?\*\*)/).forEach(seg => {
      if (!seg) return;
      const bold = seg.startsWith("**");
      runs.push({ bold, text: bold ? seg.slice(2, -2) : seg });
    });
    return { aside, runs };
  });
}

function buildParagraph(par){
  const p = document.createElement("p");
  if (par.aside) p.className = "aside";
  const spans = [];
  par.runs.forEach(run => {
    const holder = run.bold ? document.createElement("strong") : document.createDocumentFragment();
    run.text.split(/(\s+)/).forEach(tok => {
      if (tok === "") return;
      if (/^\s+$/.test(tok)){ holder.appendChild(document.createTextNode(" ")); return; }
      const s = document.createElement("span");
      s.className = "w"; s.textContent = tok;
      holder.appendChild(s); spans.push(s);
    });
    p.appendChild(holder);
  });
  return { p, spans };
}

function toBottom(){ const l = $("log"); l.scrollTop = l.scrollHeight; }

/* ---------- rendering ---------- */
async function thinkingPause(wordCount){
  const prev = $("log").lastElementChild;
  const cont = !!(prev && prev.classList.contains("ai"));
  const b = document.createElement("div");
  b.className = "turn" + (cont ? " cont" : "");
  if (!cont){
    const who = document.createElement("div");
    who.className = "who";
    who.appendChild(logo(18));
    who.appendChild(document.createTextNode(CONFIG.botName));
    b.appendChild(who);
  }
  const dots = document.createElement("div");
  dots.className = "thinking";
  dots.innerHTML = "<i></i><i></i><i></i>";
  b.appendChild(dots);
  $("log").appendChild(b); toBottom();
  await sleep(Math.min(CONFIG.thinkMaxMs, CONFIG.thinkMinMs + wordCount * CONFIG.thinkPerWordMs));
  b.remove();
}

async function typeMessage(texts){
  const prev = $("log").lastElementChild;
  const cont = !!(prev && prev.classList.contains("ai"));   // same speaker as the block above
  const turn = document.createElement("div");
  turn.className = "turn ai" + (cont ? " cont" : "");
  if (!cont){
    const who = document.createElement("div");
    who.className = "who";
    who.appendChild(logo(18));
    who.appendChild(document.createTextNode(CONFIG.botName));
    turn.appendChild(who);
  }
  const body = document.createElement("div");
  turn.appendChild(body);
  $("log").appendChild(turn);

  const caret = document.createElement("span");
  caret.className = "caret";

  const paragraphs = [];
  texts.forEach(t => parse(t).forEach(par => paragraphs.push(buildParagraph(par))));

  for (let i = 0; i < paragraphs.length; i++){
    const { p, spans } = paragraphs[i];
    body.appendChild(p);
    p.appendChild(caret);
    for (const s of spans){
      s.classList.add("show"); toBottom();
      await sleep(CONFIG.msPerWord * (0.72 + Math.random() * 0.6));
    }
    if (i < paragraphs.length - 1) await sleep(CONFIG.paragraphPauseMs);
  }
  caret.remove(); toBottom();
  return turn;
}

function userBubble(text){
  const d = document.createElement("div");
  d.className = "me";
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  $("log").appendChild(d); toBottom();
}

const wordCount = s => s.trim() ? s.trim().split(/\s+/).length : 0;

/* ---------- flow ---------- */
let unloadGuard = false;
window.addEventListener("beforeunload", e => { if (unloadGuard){ e.preventDefault(); e.returnValue = ""; } });

async function begin(){
  DATA.startedAt = new Date().toISOString();
  unloadGuard = true;
  $("intro").hidden = true;
  $("log").hidden = false;
  $("composer").hidden = false;
  await runTurn(0);
}

function markProgress(turn){
  if (!P.progress) return;
  const n = STEPS.indexOf(turn);
  if (n < 0) return;
  [...$("track").children].forEach((el, k) => el.classList.toggle("on", k <= n));
  $("counter").textContent = (n + 1) + " of " + STEPS.length;
}

async function runTurn(i){
  const turn = TURNS[i];
  markProgress(turn);

  const texts = [];
  if (FLATTERY && turn.opener) texts.push(turn.opener);
  texts.push(turn.body);

  const words = texts.reduce((n, t) => n + wordCount(t), 0);
  await thinkingPause(words);
  const node = await typeMessage(texts);
  const shown = performance.now();

  if (turn.kind === "orient"){ await sleep(CONFIG.orientPauseMs); return runTurn(i + 1); }
  if (turn.kind === "choice") return askOptions(i, turn, node, shown);
  return askOpenEnded(i, turn, shown);
}

function askOptions(i, turn, node, shown){
  return new Promise(resolve => {
    const box = document.createElement("div");
    box.className = "opts";
    const letters = ["A", "B", "C", "D"];
    const btns = turn.options.map((txt, n) => {
      const b = document.createElement("button");
      b.className = "opt"; b.disabled = true;
      b.innerHTML = "<b>" + letters[n] + "</b><span></span>";
      b.querySelector("span").textContent = txt;
      b.addEventListener("click", () => {
        btns.forEach(x => x.disabled = true);
        DATA.turns.push({ turn: turn.id, choice: letters[n], choiceText: txt,
                          msToChoose: Math.round(performance.now() - shown) });
        box.remove();
        userBubble(letters[n] + ". " + txt);
        resolve(runTurn(i + 1));
      });
      box.appendChild(b);
      return b;
    });
    node.appendChild(box);
    setTimeout(() => { box.classList.add("in"); toBottom(); }, CONFIG.optionsDelayMs);
    setTimeout(() => btns.forEach(b => b.disabled = false), CONFIG.optionsDelayMs + CONFIG.optionsLockMs);
  });
}

function askOpenEnded(i, turn, shown){
  return new Promise(resolve => {
    const ta = $("ta"), send = $("send"), box = $("box");
    let attempt = 0, busy = false;

    const open = () => {
      ta.disabled = false; box.classList.add("live");
      ta.placeholder = "Message Lumo…";
      ta.focus(); check();
    };
    const check = () => {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 150) + "px";
      send.disabled = ta.value.trim().length === 0;
    };
    ta.addEventListener("input", check);
    open();

    const submit = async () => {
      if (busy || send.disabled) return;
      busy = true;
      const text = ta.value.trim();
      const n = wordCount(text);

      DATA.turns.push({ turn: turn.id + (attempt ? "-followup" : ""), choice: "OPEN",
                        choiceText: text, words: n,
                        msToChoose: Math.round(performance.now() - shown) });

      ta.value = ""; ta.disabled = true; send.disabled = true;
      box.classList.remove("live");
      ta.placeholder = "";
      check();
      userBubble(text);

      if (attempt === 0 && n < CONFIG.probeBelowWords){
        DATA.openEnded = text; DATA.probeTriggered = 1;
        attempt = 1;
        await sleep(350);
        await thinkingPause(wordCount(PROBE));
        await typeMessage([PROBE]);
        busy = false;
        open();
        return;
      }

      if (attempt === 0) DATA.openEnded = text; else DATA.openEndedFollowUp = text;
      DATA.openEndedAll = [DATA.openEnded, DATA.openEndedFollowUp].filter(Boolean).join("\n\n");

      ta.placeholder = "Conversation complete";
      await sleep(400);
      const closing = FLATTERY ? CLOSING.flattery : CLOSING.neutral;
      await thinkingPause(wordCount(closing) + wordCount(CODE_LINE));
      await typeMessage([closing, CODE_LINE]);

      // no auto-advance: the participant reads the closing and moves on themselves
      const wrap = document.createElement("div");
      wrap.className = "go";
      const go = document.createElement("button");
      go.textContent = "Continue";
      go.disabled = true;
      go.addEventListener("click", () => { wrap.remove(); finish(); resolve(); });
      wrap.appendChild(go);
      $("log").appendChild(wrap);
      setTimeout(() => { wrap.classList.add("in"); toBottom(); }, 500);
      setTimeout(() => { go.disabled = false; }, 500 + CONFIG.finishLockMs);
    };

    send.addEventListener("click", submit);
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); });
  });
}

function finish(){
  DATA.finishedAt = new Date().toISOString();
  DATA.totalMs = new Date(DATA.finishedAt) - new Date(DATA.startedAt);
  unloadGuard = false;

  $("log").hidden = true; $("composer").hidden = true;
  $("counter").textContent = ""; $("track").hidden = true;
  $("outro").hidden = false;
  $("ccode").textContent = CONFIG.completionCode;

  if (window.parent) window.parent.postMessage({ source: "chat-stimulus", data: DATA }, "*");

  if (P.ret){
    const u = new URL(P.ret);
    u.searchParams.set("code", CONFIG.completionCode);
    u.searchParams.set("pid", P.pid);
    $("redirectNote").hidden = false;
    let n = 5;
    const tick = () => $("redirectNote").textContent = "Returning to the survey in " + n + " seconds…";
    tick();
    const t = setInterval(() => { n--; tick(); if (n <= 0){ clearInterval(t); location.href = u.toString(); } }, 1000);
  }
}
